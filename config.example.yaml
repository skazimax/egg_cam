models:
  qwen_mlx:
    model_id: mlx-community/Qwen2.5-VL-3B-Instruct-4bit
    max_tokens: 256
  yolo_world:
    model_id: yolov8s-worldv2.pt
    classes:
      - egg
      - white egg
      - brown egg
    confidence: 0.005
    image_size: 1280
    # Full-frame inference worked better on the current coop samples.
    # Set to 2 to experiment with overlapping 2x2 crops.
    tile_grid: 1
    tile_overlap: 0.15
    device: auto
  grounding_dino:
    model_id: IDEA-Research/grounding-dino-tiny
    classes:
      - a chicken egg
    box_threshold: 0.30
    text_threshold: 0.15
    device: cpu
  owlv2:
    model_id: google/owlv2-base-patch16-ensemble
    classes:
      - a chicken egg
      - a white egg
      - a brown egg
    # Context detections do not contribute to the egg count. They only prevent
    # an automatic reset while a hen is covering a nesting area.
    occlusion_classes:
      - a chicken
    occlusion_confidence: 0.50
    confidence: 0.30
    # Maximum detection-box area as a fraction of the full frame.
    # 0.002 means 0.2%; use null or 0 to disable the size filter.
    max_box_area_ratio: 0.002
    device: auto
  moondream2:
    model_id: vikhyatk/moondream2
    revision: "2025-06-21"
    query: chicken egg
    device: auto

monitor:
  model: owlv2
  # An egg must be present in this many consecutive checks.
  confirm_frames: 2
  # First detection + two control frames. The notification can be sent
  # after the first repeated detection, approximately five seconds later.
  confirmation_burst_frames: 3
  confirmation_interval_seconds: 5.0
  # Eggs visible during startup are treated as an existing baseline.
  warmup_frames: 2
  # Remove a track after this many missed checks.
  max_missed_frames: 1
  iou_threshold: 0.20
  max_center_distance: 0.035
  # Arm collection detection only after the session peak was visible in this
  # many regular polling frames. Confirmation-burst frames do not count.
  collection_arm_checks: 3
  # After arming, this many empty regular frames close the inventory session.
  # With --interval 300, six checks are approximately 30 minutes.
  collection_confirm_checks: 6
  # Fallback: reset after this many egg-free regular frames with no hen in a
  # nest zone, even when the session peak did not complete arming or bedding
  # and lighting make reference similarity unclear.
  collection_fallback_checks: 12
  # Normalized x1, y1, x2, y2 coordinates of the nesting area. A chicken is an
  # occluder only when its detection overlaps this area.
  nest_zones:
    - [0.20, 0.15, 0.51, 0.76]
  nest_occlusion_min_overlap: 0.10
  # Put several known-empty full camera frames in this directory. When the
  # directory is configured but missing/empty, collection reset is fail-closed.
  empty_reference_dir: runtime/production/empty_reference
  empty_reference_min_similarity: 0.70
  # Telegram event photos: thin boxes without labels keep small eggs visible.
  # Supported label modes: none, index, full.
  annotation_label_mode: none
  annotation_line_width: 2
  report_hour: 8
